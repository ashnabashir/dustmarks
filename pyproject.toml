[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dustmarks"
version = "0.1.0"
description = "Find the TODO and FIXME comments in your code and see how long each has waited."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ashna Bashir" }]
keywords = ["todo", "fixme", "technical-debt", "git", "git-blame", "cli", "code-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
dustmarks = "dustmarks.cli:main"

[project.urls]
Homepage = "https://github.com/ashnabashir/dustmarks"
Issues = "https://github.com/ashnabashir/dustmarks/issues"
Changelog = "https://github.com/ashnabashir/dustmarks/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dustmarks"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=dustmarks --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
